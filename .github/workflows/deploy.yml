# Reusable workflow: deploys labs-hermes to a DataRobot workload from a
# deploy repo or folder that holds VERSION, environments/<target>/.datarobot.yaml
# and an optional overrides/config/. Call it with a `uses:` line pinned to a
# commit SHA. The calling repo needs a GitHub environment that holds the
# DATAROBOT_API_TOKEN secret. While the upstream repository is not public, the
# same environment also holds a read credential for it: an UPSTREAM_DEPLOY_KEY
# (a read-only deploy key, preferred) or an UPSTREAM_TOKEN (a token with read
# access). GITHUB_TOKEN covers only the calling repo, so it cannot do this.

name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment of the calling repo that holds DATAROBOT_API_TOKEN.
        type: string
        required: true
      target:
        description: Folder under environments/ that holds the manifest, for example staging.
        type: string
        required: true
      deploy-dir:
        description: Directory of the calling repo that holds VERSION, environments/ and overrides/.
        type: string
        default: .
      mode:
        description: plan prints the plan and changes nothing. apply deploys.
        type: string
        default: plan
      lock:
        description: Lock the artifact version on apply. Locking is one-way.
        type: boolean
        default: true
      upstream-repository:
        description: Repository that holds the labs-hermes source.
        type: string
        default: datarobot-labs/labs-hermes
      datarobot-endpoint:
        description: DataRobot API endpoint.
        type: string
        default: https://app.datarobot.com/api/v2
    outputs:
      workload-id:
        description: Id of the workload that the manifest points to after the run.
        value: ${{ jobs.deploy.outputs.workload-id }}

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # A deploy takes about 10 minutes even for a small app.
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # A second `up` during a roll fails with HTTP 422, so applies run one at a time
    # and never cancel the running one. A newer pending apply replaces an older
    # pending one, which is fine: each run deploys the full state of its commit.
    # Plans have their own group, so a plan never replaces a pending apply.
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.deploy-dir }}-${{ inputs.target }}-${{ inputs.mode }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      workload-id: ${{ steps.up.outputs.workload-id }}
    env:
      # Keep in step with the ARGs in the Dockerfile. tests/static.bats checks it.
      DR_CLI_VERSION: v0.12.0
      DR_CLI_INSTALLER_REF: d3fdb737e570a619e1f3944848f8e74adb701009
      DATAROBOT_CLI_FEATURE_WORKLOAD: "true"
      DATAROBOT_CLI_NON_INTERACTIVE: "true"
      DATAROBOT_ENDPOINT: ${{ inputs.datarobot-endpoint }}
      NO_COLOR: "1"
      DEPLOY_DIR: ${{ inputs.deploy-dir }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}
      LOCK: ${{ inputs.lock }}
    steps:
      # The scripts come from the commit of this workflow, so the caller's `uses:` pin covers them too.
      - name: Check out the deploy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-src
          sparse-checkout: scripts
          ssh-key: ${{ secrets.UPSTREAM_DEPLOY_KEY }}
          token: ${{ secrets.UPSTREAM_TOKEN || github.token }}
          persist-credentials: false

      - name: Check the inputs
        run: bash workflow-src/scripts/deploy.sh check_inputs

      - name: Check out the deploy config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy-config
          persist-credentials: false

      - name: Read the version to deploy
        id: version
        run: bash workflow-src/scripts/deploy.sh read_version

      - name: Check out labs-hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.upstream-repository }}
          ref: ${{ steps.version.outputs.ref }}
          path: app
          ssh-key: ${{ secrets.UPSTREAM_DEPLOY_KEY }}
          token: ${{ secrets.UPSTREAM_TOKEN || github.token }}
          persist-credentials: false

      - name: Apply the overrides and the manifest
        run: bash workflow-src/scripts/deploy.sh apply_overrides

      - name: Install the dr CLI
        run: |
          export DR_BIN_DIR="${RUNNER_TEMP}/bin"
          bash workflow-src/scripts/deploy.sh install_dr
          echo "${DR_BIN_DIR}" >> "${GITHUB_PATH}"

      # Without the sync state, `up` uploads the code again and orphans the old catalog.
      - name: Restore the sync state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.datarobot/workload
          key: dr-state-${{ github.repository }}-${{ inputs.deploy-dir }}-${{ inputs.target }}-${{ github.run_id }}
          restore-keys: dr-state-${{ github.repository }}-${{ inputs.deploy-dir }}-${{ inputs.target }}-

      - name: Run dr workload up
        id: up
        env:
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        run: bash workflow-src/scripts/deploy.sh run_up

      # A first deploy writes workloadId into the manifest. The artifact carries it back to the repo.
      - name: Keep the manifest if the run changed it
        id: keep
        if: inputs.mode == 'apply' && always() && steps.up.outcome != 'skipped'
        run: bash workflow-src/scripts/deploy.sh keep_manifest

      - name: Upload the changed manifest
        if: inputs.mode == 'apply' && always() && steps.keep.outputs.manifest-changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ inputs.target }}
          path: ${{ steps.keep.outputs.manifest-path }}
          if-no-files-found: error

      # Gate on the deploy alone, so a failed artifact upload cannot discard the state of a successful deploy.
      - name: Save the sync state
        if: inputs.mode == 'apply' && always() && steps.up.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.datarobot/workload
          key: dr-state-${{ github.repository }}-${{ inputs.deploy-dir }}-${{ inputs.target }}-${{ github.run_id }}
