# Audits the workflows with zizmor (insecure patterns) and actionlint
# (mistakes). The tool versions are pinned by digest in Taskfile.yaml, under
# `lint:workflows`, so that CI and a local run use the same ones.
name: workflow-lint

on:
  pull_request:
    paths: [".github/**", "Taskfile.yaml"]
  push:
    branches: [main]
    paths: [".github/**", "Taskfile.yaml"]

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task lint:workflows
