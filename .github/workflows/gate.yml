# Posts the Bouncer check as the Review Router Gate App. The App key is a
# secret of the `gate` environment, which only the default branch can read, so
# a workflow on another branch can't read it. An organization admin installs
# the App on the repository and creates the environment.
#
# SECURITY: every trigger here runs this file from the default branch:
# pull_request_target for a pull request event, workflow_run for the review and
# merge queue events that "Gate trigger" announces, and schedule for the sweep.
# The job calls the API only. Do NOT add a checkout, a shell step, or a
# pull_request trigger.
#
# The action is pinned to a commit, not a floating tag, because this job holds
# the key that lets a pull request merge. Move the pin through a pull request,
# and pin a `chore: rebuild dist` commit: the merge commit before it ships the
# previous bundle.
#
# Runs for one commit don't overlap, so a run that read the facts before an
# approval was dismissed can't post its result over a later run's block.
name: Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Gate trigger]
    types: [completed]
  schedule:
    - cron: "17 3,9,15,21 * * 1-5"

permissions: {}

concurrency:
  group: gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Gate App key is an environment secret limited to the default branch.
    environment: gate
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read

      - uses: datarobot-oss/review-router@6976c52875b7a8d4698ff41397af84bf14ba7c85 # main
        with:
          mode: gate
          github-token: ${{ steps.token.outputs.token }}
          gate-app-id: ${{ vars.GATE_APP_ID }}
