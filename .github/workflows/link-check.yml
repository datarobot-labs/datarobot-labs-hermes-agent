# Checks every link in the Markdown files with lychee. It also runs weekly,
# because a link can break without any change in this repository. The tool
# version is pinned by digest in Taskfile.yaml, under `lint:links`, so that CI
# and a local run use the same one. For a link that blocks bots or needs a
# login, add a regular expression to .lycheeignore.
name: link-check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/link-check.yml", "Taskfile.yaml"]

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task lint:links
        env:
          GITHUB_TOKEN: ${{ github.token }}
