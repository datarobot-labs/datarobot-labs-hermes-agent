# Keeps the GitLab copy of this repository in step with it: main and the v*
# tags, code only. It runs in this repository alone, so a clone skips it.
# CONTRIBUTING.md, "Maintain the GitLab mirror", has the setup.
name: mirror-to-gitlab

on:
  push:
    branches: [main]
    tags: ["v*"]
  # A weekly run reports an expired token even when nobody pushes.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One push at a time. A run that waits is replaced by a newer one, which is
# safe because every run sends the whole state.
concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.repository == 'datarobot-labs/datarobot-labs-hermes-agent' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the token, and only main and the v* tags can read it.
    environment: gitlab-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main and the tags to GitLab
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: scripts/mirror-to-gitlab.sh https://gitlab.com/datarobot-labs/datarobot-labs-hermes-agent.git
