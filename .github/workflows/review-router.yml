name: Review Router

# SECURITY: This workflow intentionally uses pull_request_target (not
# pull_request) because review-router never checks out or executes PR code.
# Do NOT add actions/checkout or shell run: blocks here.
#
# If you need to build or test PR code, use a separate workflow with the
# pull_request trigger instead.
#
# See: https://github.com/datarobot-oss/review-router/blob/main/docs/security/pull-request-target.md

on:
  pull_request_target:
    types: [labeled, opened, closed, ready_for_review, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  contents: read
  pull-requests: write

# Runs for one pull request finish in order, so a slow run can't post a stale gate result.
concurrency:
  group: review-router-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    uses: datarobot-oss/.github/.github/workflows/review-router.yml@c290bf39d0950a9627e210201895d7792b8eb81d  # main
    secrets: inherit
