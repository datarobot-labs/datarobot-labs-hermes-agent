# Runs with no secrets on the events whose workflow file comes from the pull
# request (a review) or from the merge queue. Its only job is to start "Gate"
# through workflow_run, which runs from the default branch and holds the key.
# The workflow_run event names this workflow, so keep the name.
#
# SECURITY: do NOT add secrets, a checkout, or anything that runs pull request
# code here.
name: Gate trigger

on:
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "event $GITHUB_EVENT_NAME"
