# Settings for zizmor, which `task lint:workflows` and the workflow-lint
# workflow run. Every ignore names one file and says why. tests/static.bats
# fails when an ignore names any other file.
rules:
  # review-router.yml calls the shared Review Router workflow of the
  # datarobot-oss organization, which needs these triggers, the secrets
  # inheritance, and a commit pin that the organization sets.
  dangerous-triggers:
    ignore:
      - review-router.yml
  secrets-inherit:
    ignore:
      - review-router.yml
