# Policy of the Review Router gate: what may pass without a person's approval.
# Reference: https://github.com/datarobot-oss/review-router/blob/main/docs/setup/gate.md
dependabot:
  allowed_paths:
    - config/requirements.txt
  max_changed_files: 3
  defaults:
    update_types: [patch, minor]
    min_compatibility: 70
