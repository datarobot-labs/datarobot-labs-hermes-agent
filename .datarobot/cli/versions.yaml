# Tools `dr start` checks for (and offers to install) before it runs the
# Taskfile's `start` task. `dr deps check` runs the same checks on their own.
#
# This file is also what marks the repo as a `dr` project: without a
# non-empty .datarobot/cli/, `dr run`, `dr start` and `dr dotenv` all refuse
# to run here. It replaces dr's built-in defaults (Python, uv, Pulumi), none
# of which deploying Hermes needs. Docker is left out on purpose: the image
# builds server-side, so only local runs and `dr run install:*` need it, and
# those tasks check for it themselves.
dr:
  name: DataRobot CLI
  # The release the deploy docs and tasks are written for. It has
  # `dr workload config --sync-env`, which `dr run env` uses, `dr workload up
  # --promote`, no feature gate on `dr workload`, and the `.drignore` name.
  # From this release `dr workload up` also finishes a deploy that a timeout or
  # Ctrl-C interrupted, instead of reporting "Already up to date".
  minimum-version: 0.14.1
  command: dr self version
  url: https://github.com/datarobot-oss/cli
  install:
    macos: brew install datarobot-oss/taps/dr-cli
    linux: curl -fsSL https://cli.datarobot.com/install | sh
# dr-sync as a dr plugin, so `dr sync` runs with the login dr already has:
# dr start uses it to create the workload's state store. The release is the
# one the image pins (the Dockerfile's DR_SYNC_VERSION); bump them together.
# The plugin isn't in dr's registry, so it comes from that release, and its
# manifest still says 0.1.0 whatever the release, so the minimum can't tell
# releases apart.
sync:
  name: datarobot-sync dr plugin
  minimum-version: 0.1.0
  command: dr plugin version sync
  url: https://github.com/datarobot-labs/datarobot-sync#install
  install:
    macos: dr plugin install sync --url https://github.com/datarobot-labs/datarobot-sync/releases/download/v0.2.2/sync-0.1.0.tar.xz
    linux: dr plugin install sync --url https://github.com/datarobot-labs/datarobot-sync/releases/download/v0.2.2/sync-0.1.0.tar.xz
    windows: dr plugin install sync --url https://github.com/datarobot-labs/datarobot-sync/releases/download/v0.2.2/sync-0.1.0.tar.xz
task:
  name: Task
  # Wildcard task names (`install:*`) and `aliases`.
  minimum-version: 3.40.0
  command: task --version
  url: https://taskfile.dev/installation/
  install:
    macos: brew install go-task
    linux: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
