# Rolls the workload that the committed .datarobot.yaml names. Off until a
# clone sets the CI/CD variable DEPLOY_TO_DATAROBOT to true, so this project
# and every fresh clone or fork skip it and start no pipeline. It runs only on
# the default branch, and never in a scheduled pipeline, which only syncs.
#
# The sync job pulls main and the v* tags from GitHub. It is off until a project
# sets SYNC_FROM_GITHUB to true and schedules a pipeline. docs/GITLAB.md has the
# setup for both.
stages:
  - sync
  - check
  - deploy

include:
  # The component pins the DataRobot CLI and runs `dr workload up`. The commit
  # is the release 2.0.0 of datarobot-oss/workload-deploy.
  - component: $CI_SERVER_FQDN/datarobot-oss/workload-deploy/deploy@0c6bce5f5af5436b2584a2ae9ac46386ced5c3c4
    inputs:
      environment: datarobot
      # Alpine 3.21, pinned by digest like every image here. The deploy job
      # holds the API token, so a moved tag must not change what it runs.
      # Dependabot doesn't read this file, so update the digest by hand.
      image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
      rules:
        - if: $DEPLOY_TO_DATAROBOT == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      # GitLab rejects a pipeline that has the deploy job but not its stop job,
      # so the stop job follows the same gate. It stays a manual job.
      stop_rules:
        - if: $DEPLOY_TO_DATAROBOT == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
          when: manual

# Pushes main and the v* tags from GitHub to this project with the job token.
# The project must allow Git push requests from job tokens. A push made with the
# job token starts no pipeline, so a sync never triggers a deploy by itself.
# SYNC_SOURCE_URL is the repository to pull from. A project variable of the same
# name replaces the default.
sync-from-github:
  stage: sync
  image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
  variables:
    SYNC_SOURCE_URL: https://github.com/datarobot-labs/datarobot-labs-hermes-agent.git
  rules:
    - if: $SYNC_FROM_GITHUB == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  before_script:
    - apk add --no-cache git
  script:
    - sh scripts/sync-from-github.sh "$SYNC_SOURCE_URL" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

# The same check `dr run deploy` makes: the workload keeps its own API key,
# never the token of whoever wrote the manifest.
check-manifest:
  stage: check
  image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
  rules:
    - if: $DEPLOY_TO_DATAROBOT == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      exists:
        - .datarobot.yaml
  script:
    - sh scripts/workload-config.sh --check
