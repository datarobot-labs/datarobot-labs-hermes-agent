# Fronts the workload's one exposed port (8642) and splits traffic between
# hermes-webui (default) and the Hermes gateway's own API, which the
# Dockerfile moved to a loopback-only port (127.0.0.1:8643) precisely so
# nginx can be the only thing bound externally.
#
# Runs as uid 1000 on a read-only root filesystem with only /tmp writable
# (see Dockerfile's top comment) -- every writable path below is
# redirected under /tmp/nginx, created by docker/entrypoint.sh on boot.
# Verified live in that exact configuration (uid 1000, --read-only,
# tmpfs /tmp): `error_log stderr` works, `error_log /dev/stderr` does not
# (uid 1000 gets EACCES opening the device node directly).
daemon off;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Above hermes-webui's own 20 MB default upload cap (HERMES_WEBUI_MAX_UPLOAD_MB).
    client_max_body_size 32m;

    # Standard idiom for conditionally forwarding the WebSocket upgrade --
    # only the gateway's /v1/browser-control/ws needs this, but it's
    # harmless to define once at the http level.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8642;

        # gateway_api: everything below stays on the gateway rather than
        # falling through to hermes-webui's catch-all -- kept together so
        # the reason is visible in one place.
        #
        #   /health must NOT go to the WebUI. It's the k8s readinessProbe
        #   target, and the point of hitting the gateway's own /health is
        #   that a wedged (not exited) gateway event loop can't answer it
        #   either -- the WebUI answering its own /health would prove
        #   nothing about whether the actual agent is still alive.
        #
        #   /api/jobs*, /api/cron/fire, /api/model/options and
        #   /api/platforms/*/events are the gateway's own native HTTP API
        #   (job/cron control, per-platform webhook ingress) -- verified
        #   against hermes-webui's own route table (api/routes.py) that
        #   none of these literal paths are also claimed by the WebUI, so
        #   they're a safe, unambiguous carve-out from its catch-all
        #   `location /` below.
        #
        #   The gateway ALSO has its own /api/sessions* HTTP API, but that
        #   one is deliberately NOT carved out here: hermes-webui uses the
        #   exact same literal path (`/api/sessions`) for its own session
        #   list -- the left-sidebar feature its whole UI is built around --
        #   plus `/api/sessions/search`, `/cleanup`, `/events`, etc. Two
        #   different apps claiming the identical path can't be split by
        #   nginx; the gateway's own /api/sessions* API loses this fight
        #   and stays unreachable externally so the WebUI's actual UI
        #   works. (The gateway's /v1/runs API, used for the OpenAI-
        #   compatible surface and A2A, is unaffected -- see below.)
        # hermes-webui's Settings panel has a "restart gateway" button
        # (POST /api/health/restart -> restart_active_profile_gateway() ->
        # `hermes gateway restart`). With `hermes gateway run --no-supervise`
        # as PID 1 there is no installed service for that command to find, so
        # it stops the container. The platform owns the gateway's lifecycle,
        # so the route is blocked here.
        location = /api/health/restart {
            default_type application/json;
            return 409 '{"ok": false, "error": "Gateway restart from the WebUI is disabled in this deployment -- the gateway is supervised by the platform, not by hermes-webui. Redeploy or let the readiness probe recover it instead."}';
        }

        location = /health                    { proxy_pass http://127.0.0.1:8643; }
        location = /health/detailed           { proxy_pass http://127.0.0.1:8643; }
        location = /api/cron/fire             { proxy_pass http://127.0.0.1:8643; }
        location = /api/jobs                  { proxy_pass http://127.0.0.1:8643; }
        location ~ ^/api/jobs/                { proxy_pass http://127.0.0.1:8643; }
        location = /api/model/options         { proxy_pass http://127.0.0.1:8643; }
        location ~ ^/api/platforms/.+/events$ { proxy_pass http://127.0.0.1:8643; }

        # The gateway's OpenAI-compatible API, runs API, per-profile
        # ingress, and browser-control WebSocket.
        location ~ ^/(v1|p)(/|$) {
            proxy_pass http://127.0.0.1:8643;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Everything else is hermes-webui: the UI shell, its static assets,
        # and its own /api/* namespace. proxy_buffering is off so SSE chat
        # streams reach the browser as they're written rather than being
        # held in nginx's buffer -- the WebUI also sends its own
        # `X-Accel-Buffering: no` on those responses, which nginx honors
        # per-response regardless, so this is belt-and-suspenders.
        # (If streaming ever looks stalled through a proxy despite that,
        # hermes-webui has an opt-in HERMES_WEBUI_SSE_CHUNKED=1 fallback
        # for proxies that read upstream responses with read-until-close
        # semantics -- not needed against nginx, verified live below.)
        location / {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
